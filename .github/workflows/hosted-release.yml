name: CariFive hosted release checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'vercel.json'
      - 'Control-Centre/v3/**'
      - 'qa/hosted_release_smoke.py'
      - '.github/workflows/hosted-release.yml'

# Cancel superseded PR runs before they burn additional hosted-runner minutes.
# This does not bypass billing limits or waive the release acceptance criteria.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hosted-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify public routes and ensure local APIs stay private
        run: python qa/hosted_release_smoke.py
