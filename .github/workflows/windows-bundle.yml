name: AIBO Windows bundle verification

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'Control-Centre/**'
      - 'System/**'
      - 'Industry-Packs/**'
      - 'build-windows.ps1'
      - 'packaging/**'
      - 'build-windows-installer.ps1'
      - 'tests/**'
      - '.github/workflows/windows-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-bundle:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python regression suite
        run: python -m unittest discover -s tests -v
      - name: Install bundle dependencies
        run: python -m pip install pyinstaller playwright pywebview
      - name: Build Windows executable
        shell: pwsh
        run: ./build-windows.ps1
      - name: Check bundled resources
        shell: pwsh
        run: |
          $app = "dist/AIBO/_internal"
          if (!(Test-Path $app)) { throw "Missing bundled application data directory" }
          foreach ($item in @("Control-Centre/v3/index.html", "Control-Centre/v3/app.js", "Control-Centre/standard/index.html", "Control-Centre/custom/index.html", "System/project-registry.json", "Industry-Packs/README.md", "runtime/agents.json", "runtime/connectors.json")) {
            if (!(Test-Path (Join-Path $app $item))) { throw "Missing bundle resource: $item" }
          }
          if (!(Test-Path "dist/AIBO/AIBO.exe")) { throw "Missing Windows executable" }
      - name: Upload portable Windows Control Centre
        if: success()
        continue-on-error: true # Upload may be blocked by repository artifact quota.
        uses: actions/upload-artifact@v4
        with:
          name: AIBO-Control-Centre-3-Windows
          path: dist/AIBO/
          retention-days: 1
      - name: Executable loopback smoke
        shell: pwsh
        run: |
          & "dist/AIBO/AIBO.exe" --verify-desktop
          if ($LASTEXITCODE -ne 0) { throw 'Packaged native WebView unavailable' }
          # Windowed Windows binaries have no stdout: probe a pre-allocated localhost port.
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $url = "http://127.0.0.1:$port"
          $proc = Start-Process -FilePath (Resolve-Path "dist/AIBO/AIBO.exe") -ArgumentList @("--headless", "--port", "$port", "--strict-port") -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 100; $i++) {
              Start-Sleep -Milliseconds 500
              if ($proc.HasExited) { throw "Executable exited before HTTP startup" }
              try {
                $response = Invoke-WebRequest -Uri ($url + "/v3/") -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
            }
            if (!$ready) { throw "Packaged executable did not serve /v3/" }
            # Rehearse the same read-only smoke used after installation.
            & ./qa/production_smoke.ps1 -BaseUrl $url
            foreach ($endpoint in @("/v3/", "/standard/", "/custom/", "/api/products/custom")) {
              $response = Invoke-WebRequest -Uri ($url + $endpoint) -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -ne 200) { throw "HTTP smoke failed for $endpoint" }
            }
            # Verify packaged app writes project files to user state, not frozen resources.
            $created = Invoke-RestMethod -Uri ($url + "/api/projects/custom") -Method Post -ContentType "application/json" -Body '{"name":"Packaged Acceptance Project","industry":"Internal verification","region":"Germany","corePack":null,"addOns":[]}'
            if ($created.project -ne "packaged-acceptance-project") { throw "Packaged project creation failed" }
            $setupBody = '{"fields":{"name":"Packaged Acceptance Project","region":"Germany","goal":"Verify packaged Soni","audience":"Internal","successMeasure":"Mock execution accepted"},"step":2,"complete":true}'
            $setup = Invoke-RestMethod -Uri ($url + "/api/setup/custom/packaged-acceptance-project") -Method Post -ContentType "application/json" -Body $setupBody
            if (!$setup.complete) { throw "Packaged project setup failed" }
            $run = Invoke-RestMethod -Uri ($url + "/api/work/custom/packaged-acceptance-project") -Method Post -ContentType "application/json" -Body '{"task":"Verify frozen project execution","provider":"mock"}'
            $detail = Invoke-RestMethod -Uri ($url + "/api/run/" + $run.id) -TimeoutSec 15
            if ($detail.status -ne "completed" -or $detail.result.soni -notmatch "MOCK") { throw "Packaged Soni execution failed" }

          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
